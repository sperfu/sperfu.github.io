name: Refresh GA4 visitor statistics cache

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-visitor-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve aggregate GA4 statistics
        env:
          STATS_ENDPOINT: https://script.google.com/macros/s/AKfycbykFmqNCy8jOmL6H-3fqW4Y8l98s-WEPqhizUgkhggmKLhsIuaWocVry1YyX8pfp1ZD/exec
        run: |
          set -euo pipefail
          response="$(curl --fail --retry 3 --retry-delay 5 --max-time 60 --silent --show-error "$STATS_ENDPOINT")"
          printf '%s' "$response" | jq -e '
            (.pageViews | numbers) and
            (.visitors | numbers) and
            (.pageViews >= 0) and
            (.visitors >= 0)
          ' >/dev/null
          jq -n \
            --argjson pageViews "$(printf '%s' "$response" | jq '.pageViews')" \
            --argjson visitors "$(printf '%s' "$response" | jq '.visitors')" \
            --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{pageViews: $pageViews, visitors: $visitors, updatedAt: $updatedAt}' \
            > assets/data/visitor-stats.json

      - name: Commit refreshed cache when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/data/visitor-stats.json; then
            echo "Visitor statistics cache is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/visitor-stats.json
          git commit -m "Refresh visitor statistics cache"
          git push
